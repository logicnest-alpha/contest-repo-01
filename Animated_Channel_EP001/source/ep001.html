<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EP001 render</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #06080D; }
  #art { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  #grain { position: absolute; inset: 0; width: 1080px; height: 1920px; opacity: 0.085; mix-blend-mode: overlay; pointer-events: none; }
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 60% at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.5) 100%); pointer-events: none; }
  #cap { position: absolute; left: 90px; right: 90px; text-align: center; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 64px; line-height: 1.12; letter-spacing: -0.01em; color: #F5F3EE; text-shadow: 0 2px 14px rgba(0,0,0,0.65), 0 0 2px rgba(0,0,0,0.5); transform: translateY(-50%); }
  #cap em { font-style: normal; color: #E8A04F; }
</style>
</head>
<body>
<div id="stage">
  <svg id="art" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="vig"></div>
  <canvas id="grain" width="540" height="960"></canvas>
  <div id="cap"></div>
</div>
<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, x) => a + (b - a) * x;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const R = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

function dust(n, seed, x0, y0, w, h, t, color, op, r) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = R(seed * 31 + i * 7.13), b = R(seed * 17 + i * 3.71), c = R(seed * 5 + i * 9.27), d = R(seed * 11 + i * 1.93);
    const px = x0 + a * w + Math.sin(t * 0.5 + i * 1.7) * 1.1;
    const py = y0 + (((b * h - t * (0.6 + c * 1.2)) % h) + h) % h;
    const o = op * (0.35 + 0.65 * d) * (0.65 + 0.35 * Math.sin(t * 1.7 + i));
    s += `<circle cx="${px.toFixed(2)}" cy="${py.toFixed(2)}" r="${(r * (0.5 + c)).toFixed(2)}" fill="${color}" opacity="${o.toFixed(3)}"/>`;
  }
  return s;
}

const DEFS = `<defs>
  <filter id="bl05" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0.5"/></filter>
  <filter id="bl1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1"/></filter>
  <filter id="bl2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="bl4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="bl8" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>`;

// Seated figure + desk in the 200x170 pose space (see character sheet)
function rig(o) {
  const lean = o.lean || 0, a = o.lap || 0, skin = o.skin || '#5E4A42', face = o.face || skin;
  const desk = o.desk || '#33291F', leg = o.leg || '#261F19';
  return `
  <rect x="112" y="92" width="84" height="5" fill="${desk}"/>
  <rect x="116" y="97" width="4" height="63" fill="${leg}"/>
  <rect x="188" y="97" width="4" height="63" fill="${leg}"/>
  ${o.glow ? `<path d="M150 52 L158 88 L96 100 Z" fill="#A9C3E0" opacity="${o.glow}" filter="url(#bl2)"/>` : ''}
  ${o.notebook ? `<path d="M164 90 L192 90 L190 92 L166 92 Z" fill="#E9E3D6" opacity="0.95"/>` : ''}
  <rect x="122" y="88" width="38" height="4" rx="1" fill="#454B57"/>
  <path d="M158 88 L150 52 L154 51 L162 88 Z" fill="#454B57"/>
  <rect x="40" y="114" width="44" height="6" fill="#20242B"/>
  <rect x="36" y="70" width="6" height="50" fill="#20242B"/>
  <rect x="58" y="120" width="4" height="40" fill="#20242B"/>
  <path d="M50 104 L106 106 L106 118 L50 118 Z" fill="#262A32"/>
  <path d="M96 110 L108 110 L110 152 L99 152 Z" fill="#262A32"/>
  <path d="M98 150 L112 150 Q120 152 120 158 L97 158 Z" fill="#D9D5CC"/>
  <g transform="translate(0 ${o.breath || 0}) rotate(${lean} 60 112)">
    <path d="M46 66 Q62 58 76 68 L82 112 L48 114 Q40 100 42 80 Z" fill="#1A1D24"/>
    <path d="M42 62 Q50 56 58 62 L56 80 Q44 78 42 62 Z" fill="#23272F"/>
    <g opacity="${1 - a}" transform="rotate(${o.armRot || 0} 68 74)">
      <path d="M68 72 Q92 82 124 86 L124 92 Q92 94 64 84 Z" fill="#1E2229"/>
      <ellipse cx="127" cy="89" rx="4" ry="3" fill="${skin}"/>
    </g>
    <g opacity="${a}">
      <path d="M68 74 Q78 96 94 106 L91 112 Q72 102 63 82 Z" fill="#1E2229"/>
      <ellipse cx="93" cy="110" rx="3.5" ry="3" fill="${skin}"/>
    </g>
    <rect x="66" y="50" width="9" height="12" fill="${skin}"/>
    <ellipse cx="74" cy="42" rx="13" ry="15" fill="${face}"/>
    <path d="M86 40 L90 46 L85 47 Z" fill="${face}"/>
    <path d="M61 46 Q58 24 74 25 Q88 26 87 38 L84 35 L83 40 L80 35 L77 39 Q70 34 67 42 Q66 48 64 52 Z" fill="#121318"/>
    <path d="M70 26 L68 20 M76 25 L78 19 M82 28 L86 23" stroke="#121318" stroke-width="2.4" stroke-linecap="round"/>
    ${o.rim ? `<path d="M87 36 Q91 44 86 54" stroke="${o.rimColor || '#A9C3E0'}" stroke-width="1.6" fill="none" opacity="${o.rim}"/>
    <path d="M77 70 Q83 90 82 110" stroke="${o.rimColor || '#A9C3E0'}" stroke-width="1.2" fill="none" opacity="${o.rim * 0.6}"/>` : ''}
    ${o.backRim ? `<path d="M60 44 Q56 32 62 25" stroke="${o.backRimColor}" stroke-width="2.2" fill="none" opacity="${o.backRim}"/>
    <path d="M45 66 Q40 84 44 108" stroke="${o.backRimColor}" stroke-width="1.6" fill="none" opacity="${o.backRim * 0.8}"/>` : ''}
  </g>`;
}

// ---------- SCENES (drawn in 90 x 160 units) ----------
function s01(lt) {
  const br = -0.35 * Math.sin(Math.PI * clamp((lt - 0.8) / 2.4));
  return `
  <defs><linearGradient id="g01" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05080F"/><stop offset="1" stop-color="#0F1726"/></linearGradient></defs>
  <rect width="90" height="160" fill="url(#g01)"/>
  <rect y="112" width="90" height="48" fill="#0B1220"/>
  <rect x="6" y="32" width="30" height="42" fill="#3E5A82" opacity="0.3" filter="url(#bl4)"/>
  <rect x="10" y="36" width="22" height="34" fill="#1B2840"/>
  <rect x="12" y="38" width="8" height="15" fill="#6F8FBA" opacity="0.6"/>
  <rect x="22" y="38" width="8" height="15" fill="#6F8FBA" opacity="0.45"/>
  <rect x="12" y="55" width="8" height="13" fill="#5B7BA6" opacity="0.38"/>
  <rect x="22" y="55" width="8" height="13" fill="#5B7BA6" opacity="0.3"/>
  <circle cx="26.5" cy="42" r="1.6" fill="#DCE6F5" opacity="0.7" filter="url(#bl05)"/>
  <path d="M21 36 V70 M10 54 H32" stroke="#090E19" stroke-width="1.4"/>
  <polygon points="12,70 32,70 72,124 26,124" fill="#7F9CC4" opacity="0.12" filter="url(#bl2)"/>
  <ellipse cx="50" cy="121" rx="22" ry="3" fill="#5B7BA6" opacity="0.18" filter="url(#bl1)"/>
  ${dust(18, 11, 14, 66, 50, 56, lt, '#C9D8EE', 0.55, 0.2)}
  <rect x="40" y="86" width="40" height="2.4" fill="#2E251C"/>
  <rect x="42" y="88.4" width="1.4" height="24" fill="#221B15"/>
  <rect x="76.6" y="88.4" width="1.4" height="24" fill="#221B15"/>
  <path d="M76 86 L74 78.5 L78.6 73.4" stroke="#0C0D11" stroke-width="0.8" fill="none"/>
  <path d="M77.6 71.6 L82.4 73.6 L80 76.6 Z" fill="#0C0D11"/>
  <rect x="70" y="82.5" width="2.8" height="3.5" rx="0.4" fill="#9FA8B8" opacity="0.6"/>
  <rect x="52" y="84.4" width="15" height="1.8" rx="0.3" fill="#3B414C"/>
  <rect x="43" y="96" width="14" height="1.8" fill="#1B1F26"/>
  <rect x="44" y="97.8" width="0.9" height="14" fill="#1B1F26"/>
  <rect x="55" y="97.8" width="0.9" height="14" fill="#1B1F26"/>
  <g transform="translate(0 ${br.toFixed(3)})">
    <path d="M43.4 78.6 Q50 74 56.6 78.6 L57.6 96.6 L42.4 96.6 Z" fill="#191C23"/>
    <path d="M45.4 77 Q50 74.4 54.6 77 Q52.2 79.6 50 79.6 Q47.8 79.6 45.4 77 Z" fill="#22262E"/>
    <ellipse cx="50" cy="72" rx="4.1" ry="4.6" fill="#141519"/>
    <path d="M46 70.6 L45 67.8 L47.3 69.1 L47.5 66.6 L49.2 68.5 L50.4 66.2 L51.5 68.5 L53.6 67.2 L53.1 69.6 L54.8 69.8 L54 71.2 Z" fill="#141519"/>
    <path d="M46 70 Q45.5 73 46.6 75.8" stroke="#8FA8CC" stroke-width="0.35" fill="none" opacity="0.75"/>
    <path d="M43.6 79.2 Q42.9 86 42.6 95.5" stroke="#6F8FBA" stroke-width="0.3" opacity="0.55" fill="none"/>
  </g>`;
}

function s02(lt) {
  const o = ease(lt / 0.9), b = 0.06 + 0.94 * ease((lt - 0.25) / 1.0);
  const y1 = lerp(85, 56, o), y2 = lerp(81, 50, o);
  const sk = [
    [`<rect x="-6" y="-8" width="12" height="16" rx="0.6" stroke-dasharray="1.6 1"/><path d="M-4 -4 H4 M-4 -1 H2 M-4 2 H3"/>`, 62, 30, 0.8],
    [`<circle r="5" stroke-dasharray="1.6 1"/><circle r="1.4"/>`, 79, 34, 1.4],
    [`<path d="M-5 3 L3 -5 M3 -5 L0 -5 M3 -5 L3 -2"/>`, 48, 40, 2.0],
    [`<rect x="-4.5" y="-3" width="9" height="6" stroke-dasharray="1.6 1"/><path d="M-4.5 -3 L4.5 3"/>`, 74, 47, 2.6],
    [`<path d="M-6 2 Q-3 -4 0 0 T6 -3"/><circle cx="-6" cy="2" r="0.8"/><circle cx="6" cy="-3" r="0.8"/>`, 57, 21, 3.2]
  ];
  let sketches = '';
  for (const [shape, x, y, st] of sk) {
    const k = ease((lt - st) / 3.4);
    const fade = ease((lt - st) / 0.6) * (1 - 0.6 * ease((lt - 4.8) / 0.7));
    const yy = y + lerp(10, -10, k) - (lt > 4.8 ? (lt - 4.8) * 8 : 0);
    const rot = Math.sin(lt * 0.8 + x) * 4;
    sketches += `<g transform="translate(${x} ${yy.toFixed(2)}) rotate(${rot.toFixed(2)})" opacity="${fade.toFixed(3)}" fill="none" stroke-linecap="round">
      <g stroke="#E9E3D6" stroke-width="1.2" opacity="0.35" filter="url(#bl05)">${shape}</g>
      <g stroke="#F1ECE2" stroke-width="0.5">${shape}</g></g>`;
  }
  return `
  <rect width="90" height="160" fill="#060A13"/>
  <ellipse cx="64" cy="66" rx="34" ry="30" fill="#A9C3E0" opacity="${(0.22 * b).toFixed(3)}" filter="url(#bl8)"/>
  <path d="M46 ${y1.toFixed(2)} L80 ${y2.toFixed(2)} L82 82 L48 86 Z" fill="#A9C3E0" opacity="${(0.88 * b).toFixed(3)}"/>
  <g opacity="${(0.25 * b * o).toFixed(3)}" fill="#5B7BA6">
    <path d="M50 ${lerp(84, 62, o).toFixed(2)} l26 -3.2 l0 2 l-26 3.2 Z"/>
    <path d="M51 ${lerp(85, 70, o).toFixed(2)} l14 -1.7 l0 6 l-14 1.7 Z"/>
  </g>
  <path d="M44 88 L86 84 L88 90 L44 94 Z" fill="#3B414C"/>
  ${sketches}
  <path d="M0 160 L0 112 Q8 98 20 96 Q26 84 36 86 Q44 90 44 102 Q58 106 64 122 L70 160 Z" fill="#171A21"/>
  <path d="M44 102 Q58 106 64 122" stroke="#A9C3E0" stroke-width="0.7" fill="none" opacity="${(0.5 * b).toFixed(3)}"/>
  <ellipse cx="32" cy="80" rx="11" ry="13" fill="#121318"/>
  <path d="M23 72 L21 66 M28 68 L27 62 M34 68 L36 62 M40 72 L44 67" stroke="#121318" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M40 70 Q44.5 76 43 87" stroke="#C8D8EE" stroke-width="0.9" fill="none" opacity="${(0.85 * b).toFixed(3)}"/>
  <path d="M36 62 Q39 66 41 70" stroke="#C8D8EE" stroke-width="0.6" fill="none" opacity="${(0.6 * b).toFixed(3)}"/>`;
}

function s03(lt) {
  const handOut = ease(seg(lt, 1.0, 2.1));
  const peel = ease(seg(lt, 2.3, 2.8));
  const fall = seg(lt, 2.8, 4.0);
  const nx = lerp(0, 8, fall), ny = 60 * fall * fall, nr = peel * 10 + 70 * fall;
  return `
  <rect width="90" height="160" fill="#1C1814"/>
  <path d="M0 40 L90 20 M0 90 L90 70 M0 140 L90 120" stroke="#15120F" stroke-width="0.6"/>
  <rect x="58" y="-4" width="40" height="32" fill="#3F4550" transform="rotate(12 78 12)"/>
  <rect x="61" y="-1" width="34" height="24" fill="#A9C3E0" opacity="0.55" transform="rotate(12 78 12)"/>
  <ellipse cx="70" cy="22" rx="28" ry="22" fill="#A9C3E0" opacity="0.14" filter="url(#bl4)"/>
  <g transform="rotate(-8 28 57)">
    <rect x="12" y="36" width="32" height="42" fill="#C8C2B5" opacity="0.85"/>
    <path d="M16 46 H38 M16 52 H34 M16 58 H37" stroke="#4A4A50" stroke-width="0.7"/>
    <rect x="17" y="62" width="10" height="7" fill="none" stroke="#4A4A50" stroke-width="0.5"/>
    <path d="M27 65 H33 L33 70" stroke="#4A4A50" stroke-width="0.5" fill="none"/>
    <path d="M16 61 L39 75 M39 61 L16 75" stroke="#4A4A50" stroke-width="0.8"/>
  </g>
  <g transform="rotate(6 61 71)">
    <rect x="46" y="52" width="30" height="38" fill="#C8C2B5" opacity="0.78"/>
    <rect x="50" y="58" width="14" height="10" fill="none" stroke="#4A4A50" stroke-width="0.6"/>
    <path d="M50 74 H70 M50 79 H66 M50 84 H68" stroke="#4A4A50" stroke-width="0.6" stroke-dasharray="2 1.2"/>
    <path d="M66 58 L72 66" stroke="#4A4A50" stroke-width="0.6"/>
  </g>
  <g transform="rotate(10 26 92)"><rect x="20" y="86" width="12" height="12" fill="#A8A58E" opacity="0.9"/><path d="M22 88 L30 96 M30 88 L22 96" stroke="#4A4A50" stroke-width="0.6"/></g>
  <g transform="rotate(-6 40 98)"><rect x="34" y="92" width="12" height="12" fill="#A8A58E" opacity="0.88"/><path d="M36 96 H44 M36 99 H42" stroke="#4A4A50" stroke-width="0.5"/></g>
  <g transform="translate(${nx.toFixed(2)} ${ny.toFixed(2)}) rotate(${nr.toFixed(2)} 68 110)"><rect x="62" y="104" width="12" height="12" fill="#A8A58E" opacity="0.9"/><path d="M64 107 H72 M64 110 H70" stroke="#4A4A50" stroke-width="0.5"/></g>
  <path d="M30 120 L46 110" stroke="#101114" stroke-width="1.5" stroke-linecap="round"/>
  <g transform="translate(${lerp(0, -24, handOut).toFixed(2)} ${lerp(0, 26, handOut).toFixed(2)})">
    <ellipse cx="24" cy="122" rx="8" ry="5.5" fill="#5E4A42"/>
    <path d="M6 140 Q12 128 20 124 L14 160 L0 160 L0 146 Z" fill="#191C23"/>
  </g>
  <rect width="90" height="160" fill="#22324D" opacity="0.36"/>`;
}

function s04(lt) {
  const lean = lerp(-2, -14, ease(seg(lt, 0.3, 2.4)));
  const lap = ease(seg(lt, 0.5, 1.9));
  const breath = -0.8 * Math.sin(Math.PI * clamp((lt - 4.2) / 2.2));
  const flick = 0.16 + 0.03 * Math.sin(lt * 9) * (lt < 4 ? 1 : 0.3);
  return `
  <defs><linearGradient id="g04" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04070D"/><stop offset="1" stop-color="#0B1220"/></linearGradient></defs>
  <rect width="90" height="160" fill="url(#g04)"/>
  <ellipse cx="74" cy="96" rx="24" ry="20" fill="#A9C3E0" opacity="${flick.toFixed(3)}" filter="url(#bl8)"/>
  <g transform="translate(-6 58) scale(0.48)">
    ${rig({ lean, lap, glow: 0.22, face: '#241D1E', skin: '#4E3E38', rim: 0.85, breath })}
  </g>`;
}

function s05(lt) {
  const f = ease(seg(lt, 2.4, 3.4));
  const sec = Math.floor(lt) + ease(seg(lt % 1, 0, 0.12));
  const ang = 200 + sec * 6;
  const sh = lerp(-34, 34, lt / 6);
  return `
  <defs>
    <filter id="cb" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${(f * 0.9).toFixed(3)}"/></filter>
    <filter id="fb" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${((1 - f) * 1.4 + 0.01).toFixed(3)}"/></filter>
  </defs>
  <rect width="90" height="160" fill="#0D1525"/>
  <g transform="translate(${sh.toFixed(2)} 0)">
    <polygon points="-10,10 18,0 70,80 50,96" fill="#5B7BA6" opacity="0.13" filter="url(#bl2)"/>
    <polygon points="20,0 34,0 86,78 74,86" fill="#5B7BA6" opacity="0.09" filter="url(#bl2)"/>
  </g>
  <polygon points="0,60 0,92 90,150 90,118" fill="#000" opacity="0.28"/>
  <g filter="url(#cb)">
    <circle cx="45" cy="40" r="17" fill="#000" opacity="0.35" filter="url(#bl1)"/>
    <circle cx="45" cy="40" r="16" fill="#DCD6C9"/>
    <circle cx="45" cy="40" r="16" fill="none" stroke="#1A1D24" stroke-width="1.3"/>
    <path d="M45 25.8 V28.6 M45 51.4 V54.2 M30.8 40 H33.6 M56.4 40 H59.2" stroke="#1A1D24" stroke-width="0.9"/>
    <path d="M45 40 L45 31 M45 40 L52 43" stroke="#1A1D24" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M45 40 L${(45 + 12 * Math.sin(ang * Math.PI / 180)).toFixed(2)} ${(40 - 12 * Math.cos(ang * Math.PI / 180)).toFixed(2)}" stroke="#8A4A3A" stroke-width="0.55"/>
    <circle cx="45" cy="40" r="0.9" fill="#1A1D24"/>
  </g>
  <rect width="90" height="160" fill="#22324D" opacity="0.22"/>
  <g filter="url(#fb)" opacity="${lerp(0.45, 0.95, f).toFixed(3)}">
    <ellipse cx="58" cy="94" rx="10" ry="5" fill="#A9C3E0" opacity="0.25" filter="url(#bl2)"/>
    <rect x="38" y="96" width="38" height="2.2" fill="#2E251C"/>
    <rect x="40" y="98" width="1.2" height="20" fill="#221B15"/><rect x="73" y="98" width="1.2" height="20" fill="#221B15"/>
    <rect x="52" y="91" width="12" height="5" fill="#A9C3E0" opacity="0.7"/>
    <path d="M41 85 Q47 81 53 85 L54 102 L40 102 Z" fill="#191C23"/>
    <ellipse cx="47" cy="79.5" rx="4" ry="4.4" fill="#141519"/>
    <path d="M43.2 78 L42.4 75.6 L44.5 76.8 L45 74.4 L46.6 76.2 L47.8 74 L48.8 76.2 L50.8 75.2 L50.4 77.4 Z" fill="#141519"/>
  </g>`;
}

function s06(lt) {
  const ex = -0.6 * Math.sin(Math.PI * clamp((lt - 1.6) / 1.4));
  const streak = ease(seg(lt, 3.2, 4.0));
  const crowd = [
    [-10, 92, 1.25, 26, 0.32], [100, 96, 1.35, -30, 0.3], [20, 84, 0.8, 18, 0.24], [80, 82, 0.75, -16, 0.22],
    [50, 100, 1.5, 34, 0.26], [10, 86, 0.95, -22, 0.2], [70, 90, 1.1, 24, 0.24], [35, 80, 0.6, -12, 0.18]
  ];
  let people = '', front = '';
  crowd.forEach(([x0, y, sc, v, op], i) => {
    let out = '';
    if (Math.abs(v) < 1) return;
    let x = x0 + v * lt;
    x = ((x + 30) % 150 + 150) % 150 - 30;
    if (Math.abs(x - 45) < 9 * sc && sc < 1) return;
    const sx = 1 + streak * 4;
    out += `<g transform="translate(${x.toFixed(2)} ${y}) scale(${(sc * sx).toFixed(3)} ${sc})" opacity="${(op + streak * 0.25).toFixed(3)}" filter="url(#mb)">
      <ellipse cx="0" cy="0" rx="6" ry="16" fill="#6A7790"/><circle cx="0" cy="-19" r="4" fill="#6A7790"/></g>
      <circle cx="${(x + (v > 0 ? 3 : -3) * sc).toFixed(2)}" cy="${(y - 6 * sc).toFixed(2)}" r="${(1.1 * sc).toFixed(2)}" fill="#BFD3EC" opacity="${(0.6 * (1 - streak)).toFixed(3)}" filter="url(#bl05)"/>`;
    if (sc >= 1.2) front += out; else people += out;
  });
  return `
  <defs><filter id="mb" x="-100%" y="-50%" width="300%" height="200%"><feGaussianBlur stdDeviation="${(2.4 + streak * 6).toFixed(2)} 0.4"/></filter></defs>
  <rect width="90" height="160" fill="#121B2B"/>
  <polygon points="0,160 90,160 56,84 34,84" fill="#1A2334"/>
  <polygon points="0,0 34,40 34,84 0,160" fill="#0E1625"/>
  <polygon points="90,0 56,40 56,84 90,160" fill="#0E1625"/>
  <rect x="34" y="40" width="22" height="44" fill="#24304A"/>

  else {

    if (i < 0) i = SCENES.length - 1;
    body = sceneSvg(i, t);
    if (i === 7 && t < 36.1) body = sceneSvg(6, t) + sceneSvg(7, t, ease((t - 35.6) / 0.5).toFixed(3));
  }
  art.innerHTML = DEFS + body;
  const c = CUES.find(([a, b]) => t >= a && t < b);
  if (c) {
    const fade = Math.min(ease((t - c[0]) / 0.125), ease((c[1] - t) / 0.125));
    cap.innerHTML = c[2];
    cap.style.opacity = fade;
    cap.style.top = (LOW.some(([a, b]) => t >= a && t < b) ? 1340 : 1240) + 'px';
  } else cap.style.opacity = 0;
  grain();
};
window.render(0);
</script>
