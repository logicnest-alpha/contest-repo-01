<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EP004 render</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #06080D; }
  #art { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  #grain { position: absolute; inset: 0; width: 1080px; height: 1920px; opacity: 0.085; mix-blend-mode: overlay; pointer-events: none; }
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 60% at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.5) 100%); pointer-events: none; }
  #cap { position: absolute; left: 80px; right: 80px; top: 1250px; text-align: center; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 62px; line-height: 1.12; letter-spacing: -0.01em; color: #F5F3EE; text-shadow: 0 2px 14px rgba(0,0,0,0.7), 0 0 2px rgba(0,0,0,0.5); transform: translateY(-50%); }
  #cap em { font-style: normal; color: #E8A04F; }
</style>
</head>
<body>
<div id="stage">
  <svg id="art" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="vig"></div>
  <canvas id="grain" width="540" height="960"></canvas>
  <div id="cap"></div>
</div>
<script>
const TMD = __TIMING__;
const CUES = __CUES__;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, x) => a + (b - a) * x;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const R = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const L = (i) => TMD.lines[i].start, LE = (i) => TMD.lines[i].end;
const mid = (a, b) => (LE(a) + L(b)) / 2;
const F = 'font-family="Inter, sans-serif"';
const MONO = 'font-family="DejaVu Sans Mono, monospace"';

function dust(n, seed, x0, y0, w, h, t, color, op, r) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = R(seed * 31 + i * 7.13), b = R(seed * 17 + i * 3.71), c = R(seed * 5 + i * 9.27), d = R(seed * 11 + i * 1.93);
    const px = x0 + a * w + Math.sin(t * 0.5 + i * 1.7) * 1.1;
    const py = y0 + (((b * h - t * (0.6 + c * 1.2)) % h) + h) % h;
    const o = op * (0.35 + 0.65 * d) * (0.65 + 0.35 * Math.sin(t * 1.7 + i));
    s += `<circle cx="${px.toFixed(2)}" cy="${py.toFixed(2)}" r="${(r * (0.5 + c)).toFixed(2)}" fill="${color}" opacity="${o.toFixed(3)}"/>`;
  }
  return s;
}
const DEFS = `<defs>
  <filter id="bl05" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0.5"/></filter>
  <filter id="bl1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1"/></filter>
  <filter id="bl2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="bl4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="bl8" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>`;

// a reveal: 0 → 1 over 0.45 s starting at time a
const rv = (t, a, d = 0.45) => ease(seg(t, a, a + d));
const up = (k, dy = 2.5) => `transform="translate(0 ${((1 - k) * dy).toFixed(2)})" opacity="${k.toFixed(3)}"`;

function envelope(x, y, s, o) {
  return `<g transform="translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${s.toFixed(3)})" opacity="${o.toFixed(3)}">
    <rect x="-3.2" y="-2.1" width="6.4" height="4.2" rx="0.3" fill="#E9E3D6"/>
    <path d="M-3.2 -2.1 L0 0.6 L3.2 -2.1" stroke="#8E9AB0" stroke-width="0.35" fill="none"/></g>`;
}

// ---------- C01 HOOK: emails fly into the spam folder ----------
function cHook(t) {
  const br = -0.3 * Math.sin(Math.PI * clamp((t - 0.5) / 2.4));
  let envs = '';
  for (let i = 0; i < 10; i++) {
    const t0 = 0.4 + i * 0.52, k = seg(t, t0, t0 + 2.1);
    if (k <= 0 || k >= 1) continue;
    const u = ease(k), p0 = [61, 80], p1 = [26 + R(i) * 18, 30 + R(i + 3) * 10], p2 = [75, 30];
    const x = (1 - u) ** 2 * p0[0] + 2 * (1 - u) * u * p1[0] + u * u * p2[0];
    const y = (1 - u) ** 2 * p0[1] + 2 * (1 - u) * u * p1[1] + u * u * p2[1];
    envs += envelope(x, y, lerp(0.7, 0.45, u), Math.min(1, k * 5) * (1 - ease(seg(k, 0.85, 1))));
  }
  const pulse = 0.5 + 0.5 * Math.sin(t * 6);
  const spamGlow = rv(t, L(1)) * (0.55 + 0.25 * pulse);
  return `
  <defs><linearGradient id="gh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05080F"/><stop offset="1" stop-color="#0F1726"/></linearGradient></defs>
  <rect width="90" height="160" fill="url(#gh)"/>
  <rect y="112" width="90" height="48" fill="#0B1220"/>
  <rect x="10" y="40" width="20" height="30" fill="#1B2840"/>
  <rect x="12" y="42" width="7" height="13" fill="#5B7BA6" opacity="0.4"/><rect x="21" y="42" width="7" height="13" fill="#5B7BA6" opacity="0.3"/>
  <path d="M20 40 V70 M10 56 H30" stroke="#090E19" stroke-width="1.2"/>
  <polygon points="12,70 30,70 66,122 26,122" fill="#7F9CC4" opacity="0.08" filter="url(#bl2)"/>
  <ellipse cx="61" cy="80" rx="16" ry="10" fill="#A9C3E0" opacity="0.2" filter="url(#bl4)"/>
  <rect x="40" y="86" width="40" height="2.4" fill="#2E251C"/>
  <rect x="42" y="88.4" width="1.4" height="24" fill="#221B15"/><rect x="76.6" y="88.4" width="1.4" height="24" fill="#221B15"/>
  <path d="M54 85.6 L68 85.6 L67 76.6 L55 76.6 Z" fill="#A9C3E0" opacity="0.85"/>
  <rect x="53" y="85.4" width="16" height="1.2" fill="#3B414C"/>
  <rect x="43" y="96" width="14" height="1.8" fill="#1B1F26"/>
  <rect x="44" y="97.8" width="0.9" height="14" fill="#1B1F26"/><rect x="55" y="97.8" width="0.9" height="14" fill="#1B1F26"/>
  <g transform="translate(0 ${br.toFixed(3)})">
    <path d="M43.4 78.6 Q50 74 56.6 78.6 L57.6 96.6 L42.4 96.6 Z" fill="#191C23"/>
    <path d="M45.4 77 Q50 74.4 54.6 77 Q52.2 79.6 50 79.6 Q47.8 79.6 45.4 77 Z" fill="#22262E"/>
    <ellipse cx="50" cy="72" rx="4.1" ry="4.6" fill="#141519"/>
    <path d="M46 70.6 L45 67.8 L47.3 69.1 L47.5 66.6 L49.2 68.5 L50.4 66.2 L51.5 68.5 L53.6 67.2 L53.1 69.6 L54.8 69.8 L54 71.2 Z" fill="#141519"/>
    <path d="M54 70 Q54.8 73 53.6 75.8" stroke="#A9C3E0" stroke-width="0.35" fill="none" opacity="0.8"/>
  </g>
  ${envs}
  <g transform="translate(75 30)">
    <ellipse rx="9" ry="6" fill="#B5643A" opacity="${(0.25 * spamGlow).toFixed(3)}" filter="url(#bl2)"/>
    <path d="M-6 -4 L-1.5 -4 L0 -2.5 L6 -2.5 L6 4 L-6 4 Z" fill="#2A3346" stroke="#4A5872" stroke-width="0.3"/>
    <path d="M-6 -1.2 L6 -1.2" stroke="#4A5872" stroke-width="0.3"/>
    <text y="9" text-anchor="middle" ${F} font-weight="700" font-size="2.8" fill="#9AA3B2" letter-spacing="0.4">SPAM</text>
  </g>
  ${dust(12, 4, 14, 66, 50, 50, t, '#C9D8EE', 0.45, 0.2)}`;
}

// shared laptop-screen frame for knowledge panels (dark UI)
function screen(inner, glowOp = 0.18) {
  return `
  <rect width="90" height="160" fill="#070B14"/>
  <ellipse cx="45" cy="54" rx="48" ry="46" fill="#5B7BA6" opacity="${glowOp}" filter="url(#bl8)"/>
  <path d="M5 10 L85 9 L86 95 L4 96 Z" fill="#2E333C"/>
  <path d="M7 12 L83 11 L84 93 L6 94 Z" fill="#0E182B"/>
  <path d="M7 12 L83 11 L83.2 16 L7 17 Z" fill="#14213A"/>
  <circle cx="10.5" cy="14.2" r="0.8" fill="#3E5070"/><circle cx="13.2" cy="14.2" r="0.8" fill="#3E5070"/><circle cx="15.9" cy="14.2" r="0.8" fill="#3E5070"/>
  ${inner}
  <path d="M0 98 L90 97 L90 160 L0 160 Z" fill="#0A0E16"/>
  <path d="M2 97 L88 96" stroke="#3B414C" stroke-width="1.2"/>`;
}

// ---------- C02 SETUP checklist ----------
function cSetup(t) {
  const items = [
    ['Separate sending domain', 'never your main one', 3],
    ['SPF · DKIM · DMARC', 'proves the mail is really yours', 4],
    ['Warm up for 2 weeks', 'slow, real-looking activity first', 5],
    ['30 emails / day / inbox', 'not 300', 6],
  ];
  let rows = '';
  items.forEach(([title, sub, li], i) => {
    const k = rv(t, L(li)), c = rv(t, L(li) + 0.7, 0.3), y = 33 + i * 14.5;
    rows += `<g ${up(k)}>
      <rect x="12" y="${y - 3.6}" width="5" height="5" rx="0.8" fill="none" stroke="${c > 0.5 ? '#E8A04F' : '#5E6B82'}" stroke-width="0.5"/>
      <path d="M13.1 ${y - 1.1} L14.3 ${y + 0.2} L16.2 ${y - 2.4}" stroke="#E8A04F" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-dasharray="6" stroke-dashoffset="${(6 * (1 - c)).toFixed(2)}"/>
      <text x="21" y="${y}" ${F} font-weight="800" font-size="3.9" fill="#F5F3EE">${title}</text>
      <text x="21" y="${y + 4.4}" ${F} font-weight="500" font-size="2.6" fill="#8E9AB0">${sub}</text></g>`;
  });
  const hk = rv(t, L(2));
  return screen(`
    <g ${up(hk, 1.5)}><text x="12" y="24" ${MONO} font-size="2.5" letter-spacing="0.5" fill="#8E9AB0">BEFORE YOU WRITE A WORD</text>
    <path d="M12 26.4 L78 26.2" stroke="#24314A" stroke-width="0.3"/></g>
    ${rows}`);
}

// ---------- C03 LIST verification ----------
function cList(t) {
  const bad = [1, 4, 6], s0 = L(7), s1 = LE(7), rm = rv(t, L(8) + 0.4, 0.8);
  const scanY = lerp(26, 80, seg(t, s0, s1));
  let rows = '', shift = 0;
  for (let i = 0; i < 8; i++) {
    const isBad = bad.includes(i), y0 = 31 + i * 6.6;
    const scanned = scanY > y0;
    let o = 1;
    if (isBad) { o = 1 - rm; }
    const y = y0 - shift;
    if (isBad) shift += 6.6 * rm;
    const w = 20 + R(i * 3) * 14;
    rows += `<g opacity="${o.toFixed(3)}" transform="translate(0 ${(y - y0).toFixed(2)})">
      <circle cx="14" cy="${y0 - 1}" r="1.8" fill="#24314A"/>
      <rect x="18" y="${y0 - 2.1}" width="${w.toFixed(1)}" height="2.2" rx="1" fill="#3E5070"/>
      ${scanned ? `<rect x="64" y="${y0 - 3}" width="15" height="4" rx="2" fill="${isBad ? '#5A2F22' : '#1C2C47'}"/>
      <text x="71.5" y="${y0 - 0.1}" text-anchor="middle" ${F} font-weight="700" font-size="2.4" fill="${isBad ? '#F0A07A' : '#9DB4D6'}">${isBad ? 'bounce' : 'valid'}</text>` : ''}
      ${isBad && scanned ? `<path d="M18 ${y0 - 1} L${(18 + w).toFixed(1)} ${y0 - 1}" stroke="#F0A07A" stroke-width="0.4" opacity="0.8"/>` : ''}</g>`;
  }
  const rep = lerp(0.42, 0.9, rm);
  const mk = rv(t, L(8) - 0.2);
  return screen(`
    <text x="12" y="24" ${MONO} font-size="2.5" letter-spacing="0.5" fill="#8E9AB0">VERIFY THE LIST</text>
    <path d="M12 26.4 L78 26.2" stroke="#24314A" stroke-width="0.3"/>
    ${rows}
    ${t < s1 + 0.3 ? `<rect x="9" y="${scanY.toFixed(2)}" width="72" height="0.6" fill="#A9C3E0" opacity="0.8"/><rect x="9" y="${(scanY - 3).toFixed(2)}" width="72" height="3" fill="#A9C3E0" opacity="0.08"/>` : ''}
    <g ${up(mk, 1.5)}>
      <text x="12" y="84" ${F} font-weight="700" font-size="2.6" fill="#8E9AB0">sender reputation</text>
      <rect x="12" y="86" width="66" height="2.6" rx="1.3" fill="#1A2438"/>
      <rect x="12" y="86" width="${(66 * rep).toFixed(2)}" height="2.6" rx="1.3" fill="${rm > 0.6 ? '#E8A04F' : '#5B7BA6'}"/>
    </g>`);
}

// ---------- C04 EMAIL anatomy ----------
function cEmail(t) {
  const P = [
    { li: 10, n: '1', lines: ['Hi [Name], saw you’re hiring three', 'support reps this month.'] },
    { li: 11, n: '2', lines: ['Usually that means tickets pile up', 'faster than the team can answer.'] },
    { li: 12, n: '3', lines: ['I’m building a small tool for exactly', 'that. Worth a look?'] },
  ];
  let body = '', y = 41;
  P.forEach((p, i) => {
    const k = rv(t, L(p.li), 0.6);
    const active = t >= L(p.li) && t < LE(p.li) + 0.2;
    body += `<g ${up(k, 1.5)}>
      <circle cx="10.6" cy="${y - 1.2}" r="2" fill="${active ? '#E8A04F' : '#C9C1AE'}"/>
      <text x="10.6" y="${y - 0.2}" text-anchor="middle" ${F} font-weight="800" font-size="2.6" fill="#1A1D24">${p.n}</text>
      ${p.lines.map((ln, j) => `<text x="15" y="${y + j * 4.6}" ${F} font-weight="500" font-size="3.25" fill="#1A1D24">${ln}</text>`).join('')}</g>`;
    y += 12.5;
  });
  const wc = rv(t, L(9) + 0.6);
  const leg = [['1', 'about them', 10], ['2', 'one problem', 11], ['3', 'small question', 12]];
  let legend = '', lx = 10;
  leg.forEach(([n, label, li]) => {
    const k = rv(t, L(li) + 0.4);
    legend += `<g opacity="${k.toFixed(3)}"><text x="${lx}" y="80" ${F} font-weight="700" font-size="2.5" fill="#9A6A30">${n} · ${label}</text></g>`;
    lx += 25;
  });
  const cmp = rv(t, L(13) - 0.1), strike = rv(t, L(13) + 1.0, 0.35), win = rv(t, L(13) + 1.2);
  return `
  <rect width="90" height="160" fill="#0A101C"/>
  <ellipse cx="45" cy="52" rx="46" ry="44" fill="#A9C3E0" opacity="0.10" filter="url(#bl8)"/>
  <rect x="5" y="10" width="80" height="86" rx="2" fill="#000" opacity="0.4" filter="url(#bl1)"/>
  <rect x="5" y="9" width="80" height="86" rx="2" fill="#ECE6DA"/>
  <text x="10" y="16.5" ${F} font-weight="600" font-size="2.6" fill="#7A746A">To</text>
  <text x="20" y="16.5" ${F} font-weight="600" font-size="2.8" fill="#2A2420">[name]@[company].com</text>
  <path d="M10 19 L80 19" stroke="#D8D0C0" stroke-width="0.3"/>
  <text x="10" y="23.6" ${F} font-weight="600" font-size="2.6" fill="#7A746A">Subject</text>
  <text x="20" y="23.6" ${F} font-weight="700" font-size="2.9" fill="#2A2420">quick question about hiring</text>
  <path d="M10 26.2 L80 26.2" stroke="#D8D0C0" stroke-width="0.3"/>
  <g opacity="${wc.toFixed(3)}">
    <rect x="42" y="29" width="38" height="4.4" rx="2.2" fill="#1A1D24"/>
    <text x="61" y="32.1" text-anchor="middle" ${F} font-weight="700" font-size="2.3" fill="#F5F3EE">34 words · plain text · no links</text>
  </g>
  ${body}
  <path d="M10 76 L80 76" stroke="#D8D0C0" stroke-width="0.3"/>
  ${legend}
  <g opacity="${cmp.toFixed(3)}">
    <rect x="10" y="84" width="34" height="6" rx="3" fill="#D8D0C0"/>
    <text x="27" y="88" text-anchor="middle" ${F} font-weight="700" font-size="2.6" fill="#6A6458">Can we hop on a call?</text>
    <path d="M12 87 L${lerp(12, 42, strike).toFixed(2)} 87" stroke="#B5643A" stroke-width="0.6"/>
    <text x="48.5" y="88.2" text-anchor="middle" ${F} font-weight="800" font-size="3" fill="#8A8378">→</text>
    <g opacity="${win.toFixed(3)}"><rect x="53" y="84" width="27" height="6" rx="3" fill="#E8A04F"/>
    <text x="66.5" y="88" text-anchor="middle" ${F} font-weight="800" font-size="2.8" fill="#1A1208">Worth a look?</text></g>
  </g>`;
}

// ---------- C05 FOLLOW-UPS timeline ----------
function cFollow(t) {
  const N = [
    ['DAY 1', 'First email', 'the short one', L(14)],
    ['DAY 4', 'New angle', 'same problem, different proof', L(15) + 0.2],
    ['DAY 8', 'Something useful', 'a resource, not a pitch', L(15) + 0.7],
    ['DAY 14', 'Close the loop', '“Should I stop reaching out?”', L(15) + 1.2],
  ];
  const lineK = ease(seg(t, L(14), L(15) + 1.4));
  let nodes = '';
  N.forEach(([d, title, sub, ta], i) => {
    const k = rv(t, ta), y = 30 + i * 17, nw = i > 0 ? rv(t, L(16) + 0.15 * i) : 0;
    nodes += `<g ${up(k)}>
      <circle cx="18" cy="${y}" r="2.6" fill="${i === 0 ? '#5B7BA6' : '#24314A'}" stroke="#3E5070" stroke-width="0.3"/>
      ${envelope(18, y, 0.42, 1)}
      <text x="25" y="${y - 3}" ${MONO} font-size="2.3" letter-spacing="0.4" fill="#8E9AB0">${d}</text>
      <text x="25" y="${y + 1.4}" ${F} font-weight="800" font-size="3.8" fill="#F5F3EE">${title}</text>
      <text x="25" y="${y + 5.6}" ${F} font-weight="500" font-size="2.6" fill="#9DA8BB">${sub}</text>
      <g opacity="${nw.toFixed(3)}"><rect x="66" y="${y - 2.8}" width="15" height="4.4" rx="2.2" fill="#E8A04F"/>
      <text x="73.5" y="${y + 0.3}" text-anchor="middle" ${F} font-weight="800" font-size="2.3" fill="#1A1208">+ new</text></g></g>`;
  });
  const bump = rv(t, L(16) + 1.4), bs = rv(t, L(16) + 1.9, 0.3);
  return `
  <rect width="90" height="160" fill="#0A101C"/>
  <ellipse cx="45" cy="56" rx="44" ry="40" fill="#5B7BA6" opacity="0.12" filter="url(#bl8)"/>
  <text x="12" y="17" ${MONO} font-size="2.5" letter-spacing="0.5" fill="#8E9AB0">THE FOLLOW-UP SEQUENCE</text>
  <path d="M12 19.4 L78 19.2" stroke="#24314A" stroke-width="0.3"/>
  <path d="M18 30 L18 ${(30 + 51 * lineK).toFixed(2)}" stroke="#3E5070" stroke-width="0.6"/>
  ${nodes}
  <g opacity="${bump.toFixed(3)}">
    <rect x="22" y="89" width="46" height="6" rx="3" fill="#1A2438" stroke="#3E5070" stroke-width="0.3"/>
    <text x="45" y="93" text-anchor="middle" ${F} font-weight="700" font-size="2.7" fill="#9DA8BB">“Just bumping this to the top”</text>
    <path d="M24 92 L${lerp(24, 66, bs).toFixed(2)} 92" stroke="#B5643A" stroke-width="0.6"/>
  </g>`;
}

// ---------- C06 TRUTH: window at dawn ----------
function cTruth(t) {
  const a = TMD_B.truth[0], lt = t - a;
  const warm = ease(seg(t, L(18), LE(19)));
  return `
  <defs><linearGradient id="gt" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1A2540"/><stop offset="0.5" stop-color="#36405C"/>
    <stop offset="0.82" stop-color="#B5643A"/><stop offset="1" stop-color="#EDA855"/></linearGradient></defs>
  <rect width="90" height="160" fill="#0A101C"/>
  <rect x="10" y="16" width="70" height="84" fill="#E8A04F" opacity="${(0.12 + 0.18 * warm).toFixed(3)}" filter="url(#bl8)"/>
  <rect x="18" y="22" width="54" height="70" fill="url(#gt)"/>
  <rect x="18" y="22" width="54" height="70" fill="#0A101C" opacity="${(0.35 * (1 - warm)).toFixed(3)}"/>
  <ellipse cx="50" cy="90" rx="18" ry="4" fill="#FFD9A0" opacity="${(0.3 + 0.35 * warm).toFixed(3)}" filter="url(#bl2)"/>
  <path d="M45 22 V92 M18 57 H72" stroke="#0A101C" stroke-width="1.6"/>
  <rect x="68" y="18" width="8" height="80" fill="#14171E"/>
  <path d="M12 18 L20 18 Q18.6 56 21.6 98 L12 98 Z" fill="#14171E"/>
  <polygon points="18,92 68,92 90,142 0,142" fill="#E8A04F" opacity="${(0.08 + 0.18 * warm).toFixed(3)}" filter="url(#bl1)"/>
  <rect y="120" width="90" height="40" fill="#0B111D" opacity="0.6"/>
  ${dust(14, 9, 18, 30, 54, 70, lt, '#FFE0B0', 0.4 * warm + 0.1, 0.18)}
  <path d="M35 70 Q34 59 40 58 Q46 59 45 70 Z" fill="#08090D"/>
  <path d="M36 61 L35 57 M39 59 L39 55 M42 59 L44 55.5" stroke="#08090D" stroke-width="1" stroke-linecap="round"/>
  <path d="M32 69 Q40 66 48 69 L49 96 L31 96 Z" fill="#08090D"/>
  <path d="M34 72 Q32 82 33 90 M46 72 Q48 82 47 90" stroke="#08090D" stroke-width="3" stroke-linecap="round" fill="none"/>
  <rect x="34" y="96" width="5" height="22" fill="#08090D"/><rect x="41" y="96" width="5" height="22" fill="#08090D"/>
  <path d="M40 58 Q46 59 45.4 70" stroke="#F0B060" stroke-width="0.8" fill="none" opacity="${(0.4 + 0.6 * warm).toFixed(3)}"/>
  <path d="M48 69 L49.2 95" stroke="#F0B060" stroke-width="0.6" opacity="${(0.3 + 0.5 * warm).toFixed(3)}"/>`;
}

// ---------- END CARD (1080 space) ----------
function endCard(t) {
  const f = rv(t, TMD_B.end[0] + 0.2, 0.6);
  return `<rect width="1080" height="1920" fill="#06080D"/>
  <g opacity="${f.toFixed(3)}" font-family="Inter, sans-serif" text-anchor="middle">
    <text x="540" y="600" font-size="30" font-weight="500" letter-spacing="9" fill="#8E9AB0">EPISODE <tspan fill="#E8A04F">004</tspan></text>
    <text x="540" y="690" font-size="54" font-weight="800" fill="#F5F3EE">The Reality of</text>
    <text x="540" y="756" font-size="54" font-weight="800" fill="#F5F3EE">Cold Outreach</text>
    <rect x="250" y="820" width="580" height="66" rx="33" fill="none" stroke="#E8A04F" stroke-width="2"/>
    <text x="540" y="864" font-size="28" font-weight="700" fill="#E8A04F">Scripts + setup checklist in caption</text>
    <text x="540" y="960" font-size="27" font-weight="500" fill="#8E9AB0">Next: everyone looks ahead of you at 19</text>
  </g>`;
}

const TMD_B = {
  hook: [0, mid(1, 2)], setup: [mid(1, 2), mid(6, 7)], list: [mid(6, 7), mid(8, 9)], email: [mid(8, 9), mid(13, 14)],
  follow: [mid(13, 14), mid(16, 17)], truth: [mid(16, 17), mid(19, 20)], end: [mid(19, 20), TMD.total + 1]
};
const ORDER = [
  ['hook', cHook, (p) => ({ s: lerp(1.0, 1.08, ease(p)) })],
  ['setup', cSetup, (p) => ({ s: lerp(1.0, 1.04, ease(p)) })],
  ['list', cList, (p) => ({ s: lerp(1.02, 1.05, ease(p)) })],
  ['email', cEmail, (p) => ({ s: lerp(1.0, 1.03, ease(p)) })],
  ['follow', cFollow, (p) => ({ s: lerp(1.0, 1.04, ease(p)) })],
  ['truth', cTruth, (p) => ({ s: lerp(1.0, 1.06, ease(p)) })],
];

const art = document.getElementById('art');
const cap = document.getElementById('cap');
const gctx = document.getElementById('grain').getContext('2d');
const gimg = gctx.createImageData(540, 960);
let gseed = 1;
function grain() {
  const d = gimg.data;
  for (let i = 0; i < d.length; i += 4) {
    gseed = (gseed * 1103515245 + 12345) & 0x7fffffff;
    const v = (gseed >> 16) & 255;
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  }
  gctx.putImageData(gimg, 0, 0);
}
window.TOTAL = TMD.total;
window.render = function (t) {
  let body;
  if (t >= TMD_B.end[0]) body = endCard(t);
  else {
    const [name, fn, cam] = ORDER.find(([n]) => t >= TMD_B[n][0] && t < TMD_B[n][1]) || ORDER[ORDER.length - 1];
    const [a, b] = TMD_B[name], p = clamp((t - a) / (b - a)), c = cam(p);
    body = `<g transform="translate(540 960) scale(${c.s}) translate(-540 -960)"><g transform="scale(12)">${fn(t)}</g></g>`;
    const fin = 1 - ease(seg(t, a, a + 0.12));
    if (fin > 0) body += `<rect width="1080" height="1920" fill="#06080D" opacity="${fin.toFixed(3)}"/>`;
  }
  art.innerHTML = DEFS + body;
  const c = CUES.find(([a, b]) => t >= a && t < b);
  if (c) {
    cap.innerHTML = c[2];
    cap.style.opacity = Math.min(ease((t - c[0]) / 0.1), ease((c[1] - t) / 0.1));
  } else cap.style.opacity = 0;
  grain();
};
window.render(0);
</script>
</body>
